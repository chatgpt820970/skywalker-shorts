name: ci

on:
  push:
    branches: [main]
    paths: ["**.py", "music/library.json", "config/**", ".github/workflows/**", "tests/**", "queue/**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest numpy pillow
      - name: Compile all python
        run: python3 -m py_compile *.py scripts/*.py
      - name: Unit tests (light)
        run: python3 -m pytest -q tests/test_hook_text.py tests/test_publish.py tests/test_backup_slots.py tests/test_slots.py tests/test_sourcing.py tests/test_perf_captions.py
      - name: Queue hooks are English and ids unique
        run: |
          python3 - <<'PY'
          import glob, json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          import hook_text
          seen, bad = set(), []
          for f in sorted(glob.glob("queue/2026-*.json")):
              for it in json.load(open(f)):
                  if it["id"] in seen: bad.append("dup " + it["id"])
                  seen.add(it["id"])
                  if it.get("status", "queued") != "queued" or it["slot"] < "2026-11-12T17:30":
                      continue
                  rp = Path("results") / f"{it['id']}.json"
                  if rp.exists():
                      try:
                          if json.loads(rp.read_text()).get("status") == "done":
                              continue
                      except Exception:
                          pass
                  e = hook_text.check_item_hook_fields(it)
                  if e: bad.append(f"{it['id']}: {e}")
          print("\n".join(bad) or "queue ok")
          sys.exit(1 if bad else 0)
          PY
