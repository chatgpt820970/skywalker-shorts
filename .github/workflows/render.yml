name: render

on:
  push:
    branches: [main]
    paths: ["queue/*.json"]
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated queue ids to force-render (empty = due items only)"
        required: false
        default: ""
      max:
        description: "Max items this run"
        required: false
        default: "3"
      retry_failed:
        description: "Retry items whose result is failed or retry_queued"
        type: boolean
        default: false
  schedule:
    # Hourly, so each slot is picked ~3h before and the Release is ready ~2h before upload.
    - cron: "20 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          IDS: ${{ github.event.inputs.ids }}
          MAX_PER_RUN: ${{ github.event.inputs.max || '3' }}
          RETRY_FAILED: ${{ github.event.inputs.retry_failed || 'false' }}
          RENDER_AHEAD_HOURS: "3"
        run: python3 scripts/plan.py

  render:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/huggingface/hub
            ~/.cache/faster_whisper
          key: faster-whisper-small-int8-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            faster-whisper-small-int8-
            faster-whisper-
      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q vidstabdetect; then
            echo "System ffmpeg lacks vidstab; installing static GPL build"
            curl -fsSL -o /tmp/ffmpeg.txz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            mkdir -p /tmp/ff && tar -xJf /tmp/ffmpeg.txz -C /tmp/ff --strip-components=1
            sudo install -m 0755 /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
            hash -r
          fi
          ffmpeg -hide_banner -filters | grep -q vidstabdetect || { echo "ffmpeg still lacks vidstab"; exit 1; }
          pip install -q -r requirements.txt "yt-dlp[default]"
      - name: Render ${{ matrix.id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_WHISPER_MODEL: small
        run: python3 scripts/render_item.py "${{ matrix.id }}"
      - name: Telegram preview (only after QA passed)
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ID: ${{ matrix.id }}
        run: |
          st=$(python3 -c "import json,sys;print(json.load(open('results/'+sys.argv[1]+'.json')).get('status',''))" "$ID" 2>/dev/null || true)
          if [ "$st" != "done" ]; then echo "QA not passed (status=$st): no Telegram preview"; exit 0; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Telegram secrets not set: skipping"; exit 0; fi
          master="out/render-$ID.mp4"
          [ -f "$master" ] || { echo "master $master missing"; exit 0; }
          # 4K master stays untouched for YouTube; this is a separate small copy.
          ffmpeg -hide_banner -loglevel error -y -i "$master" -vf "scale=1080:1920:flags=lanczos" \
            -c:v libx264 -preset veryfast -crf 22 -maxrate 4M -bufsize 8M -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart preview.mp4
          sz=$(stat -c %s preview.mp4)
          if [ "$sz" -ge 50000000 ]; then
            ffmpeg -hide_banner -loglevel error -y -i "$master" -vf "scale=1080:1920:flags=lanczos" \
              -c:v libx264 -preset veryfast -crf 26 -maxrate 2M -bufsize 4M -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart preview.mp4
            sz=$(stat -c %s preview.mp4)
          fi
          echo "preview size $sz bytes"
          [ "$sz" -lt 50000000 ] || { echo "preview still >= 50MB, not sending"; exit 0; }
          title=$(python3 -c "import json,glob,sys
          for f in glob.glob('queue/*.json'):
              for it in json.load(open(f)):
                  if it.get('id')==sys.argv[1]: print(it.get('title','')[:900]); raise SystemExit" "$ID" 2>/dev/null || true)
          curl -sS --fail-with-body -o /tmp/tg.json -w "telegram http %{http_code}\n" \
            -F chat_id="$TELEGRAM_CHAT_ID" -F video=@preview.mp4 -F supports_streaming=true \
            -F caption="Skywalker ready (QA passed): $ID
          $title" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" || { echo "Telegram send failed"; head -c 300 /tmp/tg.json; exit 1; }
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.id }}
          path: |
            results/${{ matrix.id }}.json
            out/work_${{ matrix.id }}/qa/qa_extra.json
            out/work_${{ matrix.id }}/qa/qa_all.jpg
            out/work_${{ matrix.id }}_a3/qa/qa_extra.json
            out/work_${{ matrix.id }}_a3/qa/qa_all.jpg
          if-no-files-found: ignore

  commit-results:
    needs: [plan, render]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: result-*
      - name: Commit results/<id>.json
        run: |
          find art -path '*/results/*.json' -exec cp {} results/ \;
          git config user.name "skywalker-render"
          git config user.email "actions@users.noreply.github.com"
          git add results/*.json || true
          git diff --cached --quiet && exit 0
          git commit -m "results: ${{ needs.plan.outputs.ids }} (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
