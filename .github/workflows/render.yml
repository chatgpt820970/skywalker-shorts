name: render

on:
  push:
    branches: [main]
    paths: ["queue/*.json"]
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated queue ids to force-render (empty = due items only)"
        required: false
        default: ""
      max:
        description: "Max items this run"
        required: false
        default: "3"
      retry_failed:
        description: "Retry items whose result is failed or retry_queued"
        type: boolean
        default: false
  schedule:
    # Hourly, so each slot is picked ~3h before and the Release is ready ~2h before upload.
    - cron: "20 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          IDS: ${{ github.event.inputs.ids }}
          MAX_PER_RUN: ${{ github.event.inputs.max || '3' }}
          RETRY_FAILED: ${{ github.event.inputs.retry_failed || 'false' }}
          RENDER_AHEAD_HOURS: "3"
        run: python3 scripts/plan.py

  render:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/huggingface/hub
            ~/.cache/faster_whisper
          key: faster-whisper-small-int8-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            faster-whisper-small-int8-
            faster-whisper-
      - name: Install ffmpeg + deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq -o Acquire::Retries=5 --fix-missing ffmpeg; then break; fi
            echo "apt attempt $i failed (mirror/DNS flake); retrying in 20s"; sleep 20
          done
          command -v ffmpeg >/dev/null || echo "apt ffmpeg unavailable; will use static build"
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q vidstabdetect; then
            echo "System ffmpeg lacks vidstab; installing static GPL build"
            curl -fsSL -o /tmp/ffmpeg.txz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            mkdir -p /tmp/ff && tar -xJf /tmp/ffmpeg.txz -C /tmp/ff --strip-components=1
            sudo install -m 0755 /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
            hash -r
          fi
          ffmpeg -hide_banner -filters | grep -q vidstabdetect || { echo "ffmpeg still lacks vidstab"; exit 1; }
          pip install -q -r requirements.txt "yt-dlp[default]"
      - name: Render ${{ matrix.id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_WHISPER_MODEL: small
        run: python3 scripts/render_item.py "${{ matrix.id }}"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.id }}
          path: |
            results/${{ matrix.id }}.json
            out/work_${{ matrix.id }}/qa/qa_extra.json
            out/work_${{ matrix.id }}/qa/qa_all.jpg
            out/work_${{ matrix.id }}_a3/qa/qa_extra.json
            out/work_${{ matrix.id }}_a3/qa/qa_all.jpg
          if-no-files-found: ignore

  commit-results:
    needs: [plan, render]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: result-*
      - name: Commit results/<id>.json
        run: |
          mkdir -p art results
          find art -path '*/results/*.json' -exec cp {} results/ \;
          git config user.name "skywalker-render"
          git config user.email "actions@users.noreply.github.com"
          git add results/*.json || true
          git diff --cached --quiet && exit 0
          git commit -m "results: ${{ needs.plan.outputs.ids }} (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
