name: render

on:
  push:
    branches: [main]
    paths: ["queue/*.json", "config/force_render.json"]
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated queue ids to force-render (empty = due items only)"
        required: false
        default: ""
      max:
        description: "Max items this run"
        required: false
        default: "4"
      retry_failed:
        description: "Retry items whose result is failed or retry_queued"
        type: boolean
        default: false
      no_publish:
        description: "Dry-run: render + upload to test-renders release, never Buffer/YouTube"
        type: boolean
        default: false
  schedule:
    # Twice an hour: 8 IST slots/day (some only 2h apart). 8h ahead + 4 parallel so a 75-min
    # render still finishes well before the slot, even if one cron is skipped.
    - cron: "20,50 * * * *"

permissions:
  contents: write
  actions: write

# Forced dispatches (explicit ids) get their own group so a long forced render never blocks the
# hourly/push planner; push+schedule share one group (a newer pending planner run replaces an older
# pending one, which is harmless). In-progress renders are never cancelled, and plan.py skips ids
# another run is still rendering.
concurrency:
  # Forced ids (dispatch or config/force_render.json) get their own group so they
  # never wait behind the hourly auto planner.
  group: render-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.ids != '') && format('ids-{0}', github.run_id) || (github.event_name == 'push' && contains(toJSON(github.event.head_commit.modified), 'force_render.json') && format('force-{0}', github.run_id)) || 'auto' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
      count: ${{ steps.p.outputs.count }}
      no_publish: ${{ steps.flags.outputs.no_publish }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          IDS: ${{ github.event.inputs.ids }}
          MAX_PER_RUN: ${{ github.event.inputs.max || '4' }}
          RETRY_FAILED: ${{ github.event.inputs.retry_failed || 'false' }}
          RENDER_AHEAD_HOURS: "8"
          GH_TOKEN: ${{ github.token }}
        run: |
          # Optional one-shot force file (used when workflow_dispatch is unavailable).
          if [ -f config/force_render.json ]; then
            F_IDS=$(python3 -c "import json; d=json.load(open('config/force_render.json')); print(','.join(d.get('ids') or []))")
            F_NP=$(python3 -c "import json; d=json.load(open('config/force_render.json')); print('1' if d.get('no_publish') else '0')")
            if [ -n "$F_IDS" ] && [ -z "$IDS" ]; then export IDS="$F_IDS"; fi
            echo "FORCE_NO_PUBLISH=$F_NP" >> "$GITHUB_ENV"
            echo "force_render ids=$F_IDS no_publish=$F_NP"
          fi
          python3 scripts/plan.py
          # If force file had no ids, plan may still pick due items; that is fine.
      - id: flags
        run: |
          NP="${{ github.event.inputs.no_publish == 'true' && '1' || '0' }}"
          if [ "${FORCE_NO_PUBLISH:-0}" = "1" ]; then NP=1; fi
          if [ -f config/force_render.json ]; then
            NP=$(python3 -c "import json; d=json.load(open('config/force_render.json')); print('1' if d.get('no_publish') else '0')")
          fi
          echo "no_publish=$NP" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/huggingface/hub
            ~/.cache/faster_whisper
          key: faster-whisper-small-int8-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            faster-whisper-small-int8-
            faster-whisper-
      - name: Install ffmpeg + deps
        timeout-minutes: 20
        run: |
          # Static GPL build first (has vidstab, no apt mirrors needed); apt only as fallback.
          if curl -fsSL --retry 5 --retry-delay 10 --max-time 300 -o /tmp/ffmpeg.txz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ffmpeg.txz -C /tmp/ff --strip-components=1
            sudo install -m 0755 /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
            hash -r
          fi
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q vidstabdetect; then
            echo "static ffmpeg unavailable; trying apt"
            for i in 1 2 3; do
              if timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg; then break; fi
              echo "apt attempt $i failed; retrying in 20s"; sleep 20
            done
          fi
          ffmpeg -hide_banner -filters | grep -q vidstabdetect || { echo "ffmpeg still lacks vidstab"; exit 1; }
          pip install -q -r requirements.txt "yt-dlp[default]"
          # Demucs (htdemucs, CPU) isolates the actors' voices from the trailer audio for the clean dialogue mix.
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs==4.1.0  # 4.1 pulls htdemucs from Hugging Face (dl.fbaipublicfiles cert expired)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/hub
            ~/.cache/huggingface/hub/models--adefossez--HTDemucs
          key: demucs-htdemucs-v2
      - uses: actions/cache@v4
        with:
          path: music/lib
          key: music-lib-${{ hashFiles('music/library.json') }}
          restore-keys: music-lib-
      - name: Render ${{ matrix.id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKY_WHISPER_MODEL: small
          SKY_NO_PUBLISH: ${{ needs.plan.outputs.no_publish == '1' && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: python3 scripts/render_item.py "${{ matrix.id }}"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ strategy.job-index }}
          path: |
            results/${{ matrix.id }}.json
            out/results/*.json
            out/work_${{ matrix.id }}/qa/qa_extra.json
            out/work_${{ matrix.id }}/qa/qa_all.jpg
            out/work_${{ matrix.id }}_a3/qa/qa_extra.json
            out/work_${{ matrix.id }}_a3/qa/qa_all.jpg
            out/work_${{ matrix.id }}*/gem_qc_sheet.jpg
            out/gemini_budget_${{ matrix.id }}.json
          if-no-files-found: ignore

  commit-results:
    needs: [plan, render]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: result-*
      - name: Commit results/<id>.json
        run: |
          mkdir -p art results
          find art -path '*/results/*.json' -exec cp {} results/ \;
          git config user.name "skywalker-render"
          git config user.email "actions@users.noreply.github.com"
          git add results/*.json || true
          git diff --cached --quiet && exit 0
          git commit -m "results: ${{ needs.plan.outputs.ids }} (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
