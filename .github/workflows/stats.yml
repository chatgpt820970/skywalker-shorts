name: stats

# Daily per-video views/likes/comments -> stats/YYYY-MM-DD.json (YouTube API if YOUTUBE_API_KEY
# secret exists, else Buffer metrics + best-effort public scrape).
on:
  schedule:
    - cron: "15 3 * * *"   # 08:45 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "yt-dlp[default]"
      - name: Collect stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/stats.py
      - name: Commit stats
        run: |
          git config user.name "skywalker-stats"
          git config user.email "actions@users.noreply.github.com"
          git add stats/ || true
          git diff --cached --quiet && exit 0
          git commit -m "stats: $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 7; done
