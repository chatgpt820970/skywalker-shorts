name: auto-retry

# When a render run finishes, re-dispatch any item left in retry_queued
# (the in-job 3-attempt ladder already ran). This is the last automatic
# chance. If that re-dispatch also fails, render_item writes status=failed
# and the run concludes failure, which wakes BIBI.
# It also self-heals cancelled render/publish runs (manual or other-bot cancels):
# scripts/heal_cancelled.py re-dispatches cancelled items unless superseded by a
# newer run, already done, retired, or cancelled 3+ times; publish is idempotent.
on:
  workflow_run:
    workflows: ["render", "publish"]
    types: [completed]
  schedule:
    - cron: "25,55 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-retry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main (results may have been pushed after the triggering SHA)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - name: Re-dispatch retry_queued items once
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --ff-only -q || true
          python3 - << 'PY'
          import glob, json, os, subprocess, sys
          ids = []
          for p in glob.glob("results/*.json"):
              try:
                  r = json.load(open(p))
              except Exception:
                  continue
              if r.get("status") == "retry_queued":
                  auto = int(r.get("auto_retries") or 0)
                  mx = int(r.get("max_auto_retries") or 1)
                  if auto < mx:
                      ids.append(r["id"])
          if not ids:
              print("no retry_queued items")
              sys.exit(0)
          # bump the counter now so a second workflow_run cannot loop forever
          # if the dispatched run is slow to start; render_item also reads this.
          # We do not commit here (contents: read). The dispatched run increments
          # auto_retries when it writes its result.
          print("dispatching", ids)
          cmd = ["gh", "workflow", "run", "render.yml",
                 "-f", f"ids={','.join(ids)}",
                 "-f", "retry_failed=true",
                 "-f", f"max={len(ids)}"]
          subprocess.check_call(cmd)
          PY

      - name: Wake health to assign ready stock (or refill)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --ff-only -q || true
          # If pre-rendered stock can cover a failed/imminent slot, let health
          # assign it and publish. Otherwise fall through to an on-demand backup render.
          gh workflow run health.yml || true
      - name: Dispatch backup topic for failed slots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUPS_ONLY: "true"
          RENDER_AHEAD_HOURS: "6"
        run: |
          set -euo pipefail
          # results are committed after the render job; pull until they appear
          for i in 1 2 3 4; do git pull --ff-only -q || true; sleep 3; done
          # Skip on-demand backup renders when ready stock can take the slot.
          ready=$(python3 scripts/backup_stock.py status | python3 -c "import sys,json; print(int(json.load(sys.stdin).get('ready') or 0))")
          if [ "$ready" -gt 0 ]; then
            echo "ready stock=$ready; health will assign, skipping backup render dispatch"
            exit 0
          fi
          ids=$(python3 scripts/plan.py | awk -F= '/^ids_csv=/{print $2}')
          if [ -z "$ids" ]; then
            echo "no failed-slot backups to dispatch"
            exit 0
          fi
          echo "dispatching backup(s): $ids"
          n=$(python3 -c "print(len('$ids'.split(',')))")
          gh workflow run render.yml -f "ids=$ids" -f "max=$n"
      - name: Self-heal cancelled render/publish runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/heal_cancelled.py
